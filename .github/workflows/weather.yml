name: 產生營地天氣資料

on:
  schedule:
    - cron: '40 21 * * *'
    - cron: '40 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 檢查金鑰格式
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python3 -c "import os,re;k=os.environ.get('CWA_API_KEY','');print('長度',len(k));print('前綴是CWA-',k.startswith('CWA-'));print('含空白',bool(re.search(r'\s',k)));print('格式正確',bool(re.match(r'^CWA-[A-Za-z0-9-]+$',k)))"

      - name: 抓氣象署預報並產生 weather.json
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python3 scripts/build_weather.py --out docs/weather.json

      - name: 提交更新
        run: |
          git config user.name  "campfire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/weather.json scripts/town_elev.json
          git diff --staged --quiet || git commit -m "weather: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
