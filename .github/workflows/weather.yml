name: 產生營地天氣資料

on:
  schedule:
    # 每 3 小時跑一次，雨量觀測才不會太舊（GitHub 用 UTC）
    - cron: '40 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# 2026-10-24：重跑與排程不要同時跑，排隊一個一個來（避免同時推送互相打架）
concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  # 2026-10-24 達哥：天氣資料要準時更新。GitHub 的排程常晚 2～3 小時、有時整個跳過，
  # 現在主要靠 weather-clock.yml 每 3 小時準時觸發（手動觸發不受影響）；這裡的排程留著當備援。
  # 排程那次如果晚到，而這 100 分鐘內已經有成功的更新，或正有一次在跑，就跳過，不重複抓。
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          EV: ${{ github.event_name }}
          ME: ${{ github.run_id }}
        run: |
          if [ "$EV" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          busy=$(gh run list -R "$R" -w weather.yml -L 10 --json databaseId,status \
                 -q "[.[] | select(.databaseId != $ME and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\"))] | length")
          last=$(gh run list -R "$R" -w weather.yml -L 10 --json databaseId,status,conclusion \
                 -q "[.[] | select(.databaseId != $ME and .status == \"completed\")][0].conclusion")
          ts=$(gh api "repos/$R/commits?path=docs/weather.json&per_page=1" -q '.[0].commit.committer.date')
          age=$(( ( $(date -u +%s) - $(date -u -d "$ts" +%s) ) / 60 ))
          echo "上一次更新 $ts（$age 分鐘前），上一次執行結果 $last，正在跑 $busy 個"
          if [ "${busy:-0}" != "0" ]; then echo "已經有一次在跑，這次排程跳過"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$last" = "success" ] && [ "$age" -lt 100 ]; then echo "資料 $age 分鐘前才更新過，這次排程跳過"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=1" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # 保護網（2026-09-22）：取回上一次成功的營地清單。快取是加密的，只存在 Actions 快取，不進儲存庫。
      - name: 取回營地快取
        uses: actions/cache/restore@v4
        with:
          path: .cache/camps.enc
          key: camps-${{ github.run_id }}
          restore-keys: camps-

      - name: 解密營地快取
        env:
          K: ${{ secrets.CWA_API_KEY }}
        run: |
          mkdir -p .cache
          if [ -f .cache/camps.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in .cache/camps.enc -out .cache/camps.json || rm -f .cache/camps.json
          fi

      - name: 抓氣象署預報並產生 weather.json
        env:
          CWA_API_KEY_RAW: ${{ secrets.CWA_API_KEY }}
        run: |
          export CWA_API_KEY="$(printf '%s' "$CWA_API_KEY_RAW" | tr -d '[:space:]')"
          python3 scripts/build_weather.py --out docs/weather.json

      # 2026-10-24 達哥：逐 3 小時預報（各縣市鄉鎮未來 3 天）。出錯只記警告，不影響 weather.json
      - name: 逐 3 小時預報（wx3h.json）
        continue-on-error: true
        env:
          CWA_API_KEY_RAW: ${{ secrets.CWA_API_KEY }}
        run: |
          export CWA_API_KEY="$(printf '%s' "$CWA_API_KEY_RAW" | tr -d '[:space:]')"
          python3 scripts/build_wx3h.py --inspect || true
          python3 scripts/build_wx3h.py --out docs/wx3h.json || { echo "::warning::逐 3 小時預報這次沒產生"; git checkout -- docs/wx3h.json 2>/dev/null || true; }

      - name: 提交更新
        run: |
          git config user.name  "campfire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/weather.json docs/towns.json scripts/town_elev.json
          # 2026-10-24：林道地圖的雨量格點
          if [ -f docs/raingrid.json ]; then git add docs/raingrid.json; fi
          # 2026-10-24：逐 3 小時預報
          if [ -f docs/wx3h.json ]; then git add docs/wx3h.json; fi
          git diff --staged --quiet || git commit -m "weather: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 2026-10-24：空位、路線的 workflow 也會推，撞到就先拉最新再推
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main
            sleep 5
          done
          git push

      - name: 加密新的營地快取
        id: enc
        env:
          K: ${{ secrets.CWA_API_KEY }}
        run: |
          if [ -f .cache/FRESH ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:K -in .cache/camps.json -out .cache/camps.enc
            echo "fresh=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 存營地快取
        if: steps.enc.outputs.fresh == '1'
        uses: actions/cache/save@v4
        with:
          path: .cache/camps.enc
          key: camps-${{ github.run_id }}

      # 2026-10-24 達哥：更新失敗要 30 分鐘後重跑直到成功。
      # 有哪一項資料沒抓到（國際模式雨量／陣風、雨量站、特報、地震），這次就算失敗，weather-retry.yml 會在 30 分鐘後重跑。
      - name: 檢查這次有沒有資料沒抓到
        run: |
          if [ -f .cache/PARTIAL ]; then
            while IFS= read -r line; do echo "::error::這次沒抓到 $line"; done < .cache/PARTIAL
            exit 1
          fi

      # 天氣照常更新了，但營地清單用的是舊快取：故意讓這次執行失敗，GitHub 會寄信通知。
      - name: 檢查是否用了舊營地清單
        run: |
          if [ -f .cache/FALLBACK ]; then
            echo "::error::資料庫頁抓不到，這次用 $(head -1 .cache/FALLBACK) 的營地快取算天氣。原因：$(sed -n 2p .cache/FALLBACK)"
            exit 1
          fi
