name: 週末空位每日更新

# 2026-10-23 達哥要求：每天查一次「週末還訂得到的營地」
# 台北時間每天 05:13 跑（GitHub 用 UTC，前一天 21:13）
on:
  schedule:
    - cron: '13 21 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '測試用：只查一個平台（ic／ec／ac／ct），留空＝全部並更新 avail.json'
        default: ''
      limit:
        description: '測試用：每個平台只查前幾家（0＝全部）'
        default: '0'
      weekends:
        description: '測試用：查幾個週末（3＝正式設定；填別的數字只測試，結果不提交）'
        default: '3'

permissions:
  contents: write

concurrency:
  group: avail
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      # 資料庫頁偶爾對 GitHub 回 429，取回上一次成功的營地清單（只有 fid 與訂位平台店家 id）備用
      - name: 取回營地清單快取
        uses: actions/cache/restore@v4
        with:
          path: .cache/avail_camps.json
          key: avail-camps-${{ github.run_id }}
          restore-keys: avail-camps-

      - name: 查四個平台的週末空位，產生 avail.json
        env:
          PYTHONUNBUFFERED: '1'
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
          WEEKENDS: ${{ inputs.weekends }}
        run: |
          W="${WEEKENDS:-3}"
          if [ -n "$ONLY" ] || [ "$W" != "3" ]; then
            # 測試模式：結果不提交
            python3 scripts/build_avail.py --out /tmp/avail_test.json --only "$ONLY" --limit "${LIMIT:-0}" --weekends "$W" --ic-budget 110
            head -c 1500 /tmp/avail_test.json
          else
            python3 scripts/build_avail.py --out docs/avail.json
          fi

      - name: 存營地清單快取
        if: always() && hashFiles('.cache/avail_camps.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/avail_camps.json
          key: avail-camps-${{ github.run_id }}

      - name: 提交更新
        if: always()
        run: |
          if [ ! -f docs/avail.json ]; then exit 0; fi
          git config user.name  "campfire-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/avail.json
          git diff --staged --quiet && exit 0
          git commit -m "avail: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 天氣 workflow 也會推，撞到就先拉最新再推
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 10
          done
